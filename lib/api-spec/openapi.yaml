openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CAFA Program Management Information System (PMIS) API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: meta
  - name: states
  - name: projects
  - name: beneficiaries
  - name: budget
  - name: risks
  - name: reports
  - name: dashboard
  - name: audit
  - name: storage
  - name: notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [meta]
      summary: Get the currently active user (from a signed session cookie; the demo identity header is available only when explicitly enabled outside production)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          description: Not authenticated

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's full profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401":
          description: Not authenticated
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current user's editable profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: Validation error
        "422":
          description: Invalid notification preference settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Not authenticated

  /profile/change-password:
    post:
      operationId: changePassword
      tags: [profile]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400":
          description: Weak password or validation error
        "401":
          description: Current password incorrect or not authenticated
        "429":
          description: Too many password-change attempts

  /profile/photo/upload-url:
    post:
      operationId: requestProfilePhotoUploadUrl
      tags: [profile]
      summary: Request a short-lived upload URL for the signed-in user's profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePhotoUploadRequest" }
      responses:
        "200":
          description: Short-lived private upload descriptor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoUploadDescriptor" }
        "413":
          description: Photo exceeds the 5 MB limit
        "415":
          description: Unsupported photo type

  /profile/photo:
    get:
      operationId: getProfilePhoto
      tags: [profile]
      summary: Stream the signed-in user's current profile photo through an authenticated proxy
      responses:
        "200":
          description: Profile image
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          description: No profile photo
    post:
      operationId: completeProfilePhotoUpload
      tags: [profile]
      summary: Verify and attach an uploaded photo to the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePhotoCompleteInput" }
      responses:
        "200":
          description: Photo attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoResponse" }
        "400":
          description: Invalid or expired upload descriptor
        "413":
          description: Actual uploaded size exceeds the limit
        "415":
          description: Uploaded content is not a permitted image
    delete:
      operationId: removeProfilePhoto
      tags: [profile]
      summary: Remove the signed-in user's profile photo
      responses:
        "200":
          description: Photo removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoResponse" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the authenticated user's notifications
      description: >
        Returns only the current recipient's rows. Results are ordered newest-first
        by created timestamp and notification ID. `unread` is the total unread
        count across the recipient's full inbox, independent of list filters.
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [all, project, report, plan, risk, comment, conversation, user, document, activity, system]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Recipient-private notification page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListPage" }
        "401":
          description: Not authenticated
        "422":
          description: Invalid query parameters

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one recipient-owned notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationMutationResponse" }
        "401":
          description: Not authenticated
        "404":
          description: Notification does not exist for this recipient
        "422":
          description: Invalid notification ID

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every unread notification belonging to the current recipient as read
      responses:
        "200":
          description: Notifications marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationMutationResponse" }
        "401":
          description: Not authenticated

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with username (or email) + password and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "400":
          description: Missing identifier or password
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the active server session and clear its cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /users/switcher:
    get:
      operationId: listSwitcherUsers
      tags: [meta]
      summary: Development-only active-user list for the explicitly enabled demo role switcher (unavailable in production)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SwitcherUser" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List authorised directory users. Supports bounded server-side search, filters, and pagination.
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: stateId
          schema: { type: integer }
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDirectoryPage"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (super admin only). If status=invited or no password, an invite token is generated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCreateResponse" }

  /users/summary:
    get:
      operationId: getUsersSummary
      tags: [users]
      summary: Aggregate counts for the user-management dashboard cards
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersSummary" }

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /users/{id}/status:
    post:
      operationId: changeUserStatus
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }

  /users/{id}/resend-invite:
    post:
      operationId: resendUserInvite
      tags: [users]
      summary: Rotate and send a pending account-setup invitation (super admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteResendInput" }
      responses:
        "200":
          description: Invite token rotated. The token is returned only to the authorised issuer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteActionResponse" }

  /users/{id}/cancel-invite:
    post:
      operationId: cancelUserInvite
      tags: [users]
      summary: Cancel an unaccepted invitation and deactivate the account (super admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invitation cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /users/{id}/resend-verification:
    post:
      operationId: resendUserVerification
      tags: [users]
      summary: Send a fresh email-verification link (super admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Verification email queued or sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationResendResponse" }

  /users/invitations:
    get:
      operationId: listUserInvitations
      tags: [users]
      summary: List authorised invitation lifecycle records and full filtered lifecycle totals without account-setup tokens.
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [pending, expired, accepted, cancelled] } }
        - { in: query, name: role, schema: { type: string } }
        - { in: query, name: stateId, schema: { type: integer } }
        - { in: query, name: emailDelivery, schema: { type: string, enum: [pending, sent, failed] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Invitation lifecycle page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationListPage" }

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password directly, or re-issue an invite token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetResponse" }

  /users/{id}/effective-access:
    get:
      operationId: getUserEffectiveAccess
      tags: [users]
      summary: Resolve effective permissions and scope for a target user. Requires users.manage. Response never includes passwords, hashes, tokens, or credentials.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Effective access payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEffectiveAccess" }
        "403":
          description: Caller does not hold users.manage
        "400":
          description: Malformed user ID
        "404":
          description: Target user not found

  /states:
    get:
      operationId: listStates
      tags: [states]
      summary: List active operational State options or the administrative registry
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
          description: Administrative registry view; restricted to State-registry administrators.
        - name: officeStatus
          in: query
          schema: { type: string, enum: [present, absent, unknown] }
          description: Optional office-presence filter.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StateRecord" }
        "401":
          description: Not authenticated
    post:
      operationId: createState
      tags: [states]
      summary: Create a canonical State registry record
      description: Only State-registry administrators may create States. Manager assignment is read-only and remains owned by User Management.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StateInput" }
      responses:
        "201":
          description: State created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateRecord" }
        "401":
          description: Not authenticated
        "403":
          description: Not authorised to manage the State registry
        "409":
          description: Name or code conflicts with an existing State after normalisation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateConflictError" }
        "422":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateValidationError" }

  /states/{stateId}:
    get:
      operationId: getState
      tags: [states]
      summary: Get State registry detail and read-only references
      parameters:
        - { name: stateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateProfile" }
        "401":
          description: Not authenticated
        "404":
          description: State not found
        "422":
          description: Malformed State ID
    patch:
      operationId: updateState
      tags: [states]
      summary: Edit canonical State fields without changing its ID
      description: Only name, code, and office address are editable here. Manager assignment remains read-only and owned by User Management.
      parameters:
        - { name: stateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StateInput" }
      responses:
        "200":
          description: State updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateRecord" }
        "401":
          description: Not authenticated
        "403":
          description: Not authorised to manage the State registry
        "404":
          description: State not found
        "409":
          description: Name or code conflicts with an existing State after normalisation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateConflictError" }
        "422":
          description: Malformed State ID or validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateValidationError" }

  /states/{stateId}/lifecycle:
    patch:
      operationId: updateStateLifecycle
      tags: [states]
      summary: Confirm and update State operational or office status
      description: Only State-registry administrators may make a confirmed, audited lifecycle change. No related records are created, reassigned, or deleted.
      parameters:
        - { name: stateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StateLifecycleInput" }
      responses:
        "200":
          description: State lifecycle updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateRecord" }
        "401": { description: Not authenticated }
        "403": { description: Not authorised to manage the State registry }
        "404": { description: State not found }
        "422":
          description: State ID or lifecycle input is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateValidationError" }

  /states/{stateId}/snapshot:
    get:
      operationId: getStateSnapshot
      tags: [states]
      summary: Read State Program Report snapshot data for an existing State
      parameters:
        - { name: stateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Snapshot data for the requested State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateSnapshot" }
        "401":
          description: Not authenticated
        "404":
          description: State not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateNotFoundError" }
        "422":
          description: Malformed State ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateValidationError" }

  /voice-notes:
    get:
      operationId: listVoiceNotes
      tags: [projects]
      summary: List voice notes for an entity
      parameters:
        - { name: entityType, in: query, required: true, schema: { type: string } }
        - { name: entityId, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VoiceNote" }
    post:
      operationId: createVoiceNote
      tags: [projects]
      summary: Save a voice note after upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceNoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceNote" }

  /voice-notes/{id}:
    delete:
      operationId: deleteVoiceNote
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /voice-notes/{id}/url:
    get:
      operationId: getVoiceNoteUrl
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }

  /donors:
    get:
      operationId: listDonors
      tags: [projects]
      summary: List all donors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Donor" }
    post:
      operationId: createDonor
      tags: [projects]
      summary: Create a new donor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DonorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Donor" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects with optional filters
      parameters:
        - { name: stateId, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: sector, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/duplicate-check:
    get:
      operationId: checkProjectDuplicate
      tags: [projects]
      summary: Check if a project with the same agreement number / donor / title already exists
      parameters:
        - { name: agreementNumber, in: query, required: false, schema: { type: string } }
        - { name: donor, in: query, required: false, schema: { type: string } }
        - { name: title, in: query, required: false, schema: { type: string } }
        - { name: excludeId, in: query, required: false, schema: { type: integer }, description: "Exclude this project ID from results (used in edit mode to prevent self-matching)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateCheckResult" }

  /projects/{projectId}/merge:
    post:
      operationId: mergeProjectData
      tags: [projects]
      summary: Append states / sectors / localities to an existing project without duplication
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMergeInput" }
      responses:
        "200":
          description: Updated project summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }

  /projects/{projectId}/reporting-coverage:
    patch:
      operationId: updateProjectReportingCoverage
      tags: [projects]
      summary: Update only the canonical reporting coverage of a non-draft Project
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reportingStartDate
                - reportingEndDate
                - expectedReportingStartDate
                - expectedReportingEndDate
              properties:
                reportingStartDate: { type: string, format: date }
                reportingEndDate: { type: string, format: date }
                expectedReportingStartDate:
                  type: string
                  format: date
                  description: Current persisted start date used as an optimistic-concurrency precondition.
                expectedReportingEndDate:
                  type: string
                  format: date
                  description: Current persisted end date used as an optimistic-concurrency precondition.
      responses:
        "200":
          description: Reporting coverage updated and audited
          content:
            application/json:
              schema:
                type: object
                required: [projectId, reportingStartDate, reportingEndDate]
                properties:
                  projectId: { type: integer }
                  reportingStartDate: { type: string, format: date }
                  reportingEndDate: { type: string, format: date }
        "403": { description: Project permission or scope denied }
        "409": { description: "Draft Projects use the normal Project editor, or the reporting coverage changed since this edit began" }
        "422": { description: Invalid or inverted reporting coverage }

  /projects/donor-integrity-scan:
    get:
      operationId: scanProjectDonorIntegrity
      tags: [projects]
      summary: Scan submitted, approved, and active projects for confirmed placeholder donors
      description: >
        Read-only administrator scan. It reports only unlinked values classified
        as confirmed placeholders and separately identifies the explicit Unknown
        missing-donor marker; legitimate registered donor names are excluded.
      responses:
        "200":
          description: Focused donor integrity findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusedProjectDonorScan" }
        "401":
          description: Not authenticated
        "403":
          description: Administrator permission required

  /projects/{projectId}/donor-correction:
    post:
      operationId: correctProjectDonor
      tags: [projects]
      summary: Correct a confirmed placeholder donor without changing project workflow
      description: >
        Restricted administrative correction. The target must be a non-deleted
        submitted, approved, or active project whose current donor is a confirmed
        unlinked placeholder. donorId selects a registered donor; null records
        the explicit Unknown missing-donor state. No status transition occurs.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectDonorCorrectionInput" }
      responses:
        "200":
          description: Donor corrected; project lifecycle and unrelated data preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDonorCorrection" }
        "400":
          description: Invalid project ID or missing correction reason
        "401":
          description: Not authenticated
        "403":
          description: Administrator permission required
        "404":
          description: Project does not exist or is deleted
        "409":
          description: Target is not a confirmed placeholder or has an invalid lifecycle
        "422":
          description: Replacement donor is missing or is placeholder data

  /projects/{projectId}/development-test-retirement:
    post:
      operationId: retireDevelopmentTestProject
      tags: [projects]
      summary: Retire the explicitly reviewed development test project
      description: >
        Development-only maintenance operation for the exact reviewed fixture
        CAFA-MPLQLM3M / TX Test. It is unavailable in production, requires the
        projects.delete permission, performs a soft delete only, preserves child
        records and prior workflow history, and writes a cleanup audit entry.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmationCode]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
                confirmationCode: { type: string, enum: [CAFA-MPLQLM3M] }
      responses:
        "200":
          description: Exact development fixture softly retired
        "400":
          description: Invalid project ID, cleanup reason, or confirmation code
        "401":
          description: Not authenticated
        "403":
          description: Project deletion permission required
        "404":
          description: Development-only operation unavailable or project not found
        "409":
          description: Exact fixture identity or lifecycle did not match

