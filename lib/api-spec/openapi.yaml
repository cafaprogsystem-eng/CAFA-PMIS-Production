        - { name: module, in: query, required: false, description: "If entityType is also supplied, it must have the identical value.", schema: { type: string, enum: [ai, attachments, auth, beneficiaries, comments, conversation, drive, files, manual, manual_chapter, manual_section, manual_sop, messages, notifications, password_reset, plans, profile, program_resources, project, projects, reports, risks, states, training_videos, users] } }
