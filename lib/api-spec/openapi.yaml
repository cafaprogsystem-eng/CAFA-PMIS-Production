  /attachments/upload-descriptors:
    post:
      operationId: requestAttachmentUploadDescriptor
      tags: [storage]
      summary: Request a short-lived, parent-bound attachment upload descriptor
      description: >
        The descriptor is bound to the authenticated user and canonical Plan or
        Risk parent. It contains no reusable storage credentials or object key;
        it must only be used to upload the declared file and complete this
        operation. Client-supplied parent state, sector, and project metadata
        are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentUploadDescriptorRequest" }
      responses:
        "201":
          description: Temporary descriptor created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUploadDescriptor" }
        "400": { description: "Invalid metadata or locked parent" }
        "403": { description: "Parent scope or mutation permission denied" }
        "404": { description: Parent not found }
        "409": { description: "Replacement does not belong to the requested parent" }
        "413": { description: File is too large }
        "415": { description: Unsupported content type }
        "503": { description: Storage is not configured }

