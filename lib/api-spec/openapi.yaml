          required: [total, lastReconciliationAt, migrationClassifications, bySourceKind, byProvider, ownerDecisionPath]
          properties:
            total: { type: integer }
            lastReconciliationAt: { type: ["string", "null"], format: date-time }
            migrationClassifications:
              type: object
              additionalProperties: { type: integer }
            bySourceKind:
              type: object
              additionalProperties:
                type: object
                additionalProperties: { type: integer }
            byProvider:
              type: object
              additionalProperties: { type: integer }
            ownerDecisionPath:
              type: object
              required: [missing, orphaned, parentRemoved, ownerDecisionRequired]
              properties:
                missing: { type: string }
                orphaned: { type: string }
                parentRemoved: { type: string }
                ownerDecisionRequired: { type: string }

    LocalityWithState:
      type: object
      required: [id, name, stateId, stateName]
      properties:
        id: { type: integer }
        name: { type: string }
        stateId: { type: integer }
        stateName: { type: string }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
        scope:
          type: string
          enum: [messages, documents]
          description: >
            Set to messages for a Communication Centre attachment or voice
            upload, or documents for a File & Archive direct upload. Messages
            selects the messages.attachments.upload permission and cannot be
            combined with report-bound upload fields; documents selects
            documents.upload.
        reportId:
          type: integer
          description: >
            When present alongside entityType, gates the upload to draft-report
            authors only and causes the server to issue a signed uploadToken.
        entityType:
          type: string
          enum: [attachment, voice_note]
          description: >
            Required together with reportId. Identifies the kind of file being
            attached so the server issues the correct upload descriptor.

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
        uploadToken:
          type: string
          description: >
            Signed descriptor issued for report-bound evidence or a
            Communication Centre messages-scope upload. Must be supplied on
            the subsequent parent-record create request.

    Output:
      type: object
      required: [id, code, title]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        target: { type: ["number", "null"] }

    Activity:
      type: object
      required: [id, code, title, status, progressPct, plannedStart, plannedEnd, outputId]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string }
        progressPct: { type: integer }
        plannedStart: { type: string }
        plannedEnd: { type: string }
        target: { type: ["number", "null"] }
        outputId: { type: integer }
        outputTitle: { type: ["string", "null"] }
        indicatorId: { type: ["integer", "null"] }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        localityName: { type: ["string", "null"] }
        budgetPlanned: { type: number }
        budgetSpent: { type: number }

    Indicator:
      type: object
      required: [id, code, title, target, achieved, unit]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        unit: { type: string }
        target: { type: number }
        achieved: { type: number }
        outputId: { type: ["integer", "null"] }
        sector: { type: string }

    ProjectDetail:
      type: object
      required: [project, outputs, activities, indicators, risks, reports, beneficiariesReached, beneficiariesTarget, budgetTotal, budgetSpent, states, approvalHistory]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/Output" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/Indicator" }
        risks:
          type: array
          items: { $ref: "#/components/schemas/Risk" }
        reports:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        beneficiariesReached: { type: integer }
        beneficiariesTarget: { type: integer }
        budgetTotal: { type: number }
        budgetSpent: { type: number }
        states:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        approvalHistory:
          type: array
          items: { $ref: "#/components/schemas/ApprovalEntry" }

    ApprovalEntry:
      type: object
      required: [id, action, fromStatus, toStatus, actorName, actorRole, timestamp]
      properties:
        id: { type: integer }
        action: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        actorName: { type: string }
        actorRole: { type: string }
        comment: { type: ["string", "null"] }
        timestamp: { type: string }
        usedOverride: { type: ["boolean", "null"], description: "True when the action was performed via the PM/Super Admin self-review override" }
        overrideReason: { type: ["string", "null"], description: "Audit reason supplied for a self-review override action" }

    WorkflowTransitionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, description: "submit | state_review | technical_review | coordination_review | final_approve | activate | close | reject | request_revision" }
        comment: { type: string }
        overrideReason: { type: string, description: "Required when PM/Super Admin reviews their own report (self-review override audit reason)" }

    BudgetLine:
      type: object
      required: [id, label, planned, spent, remaining, burnRatePct, level]
      properties:
        id: { type: integer }
        label: { type: string }
        level: { type: string, description: "output | activity" }
        planned: { type: number }
        spent: { type: number }
        remaining: { type: number }
        burnRatePct: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/BudgetLine" }

    ProjectBudget:
      type: object
      required: [projectId, total, spent, remaining, burnRatePct, lines, monthly, alerts]
      properties:
        projectId: { type: integer }
        total: { type: number }
        spent: { type: number }
        remaining: { type: number }
        burnRatePct: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BudgetLine" }
        monthly:
          type: array
          items:
            type: object
            required: [month, planned, actual]
            properties:
              month: { type: string }
              planned: { type: number }
              actual: { type: number }
        alerts:
          type: array
          items:
            type: object
            required: [level, message]
            properties:
              level: { type: string }
              message: { type: string }

    Beneficiary:
      type: object
      required: [id, code, name, gender, ageGroup, category, stateId, stateName, verificationStatus, dateOfAssistance]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        gender: { type: string }
        ageGroup: { type: string }
        category: { type: string }
        vulnerability: { type: ["string", "null"] }
        stateId: { type: integer }
        stateName: { type: string }
        localityName: { type: ["string", "null"] }
        projectId: { type: ["integer", "null"] }
        projectTitle: { type: ["string", "null"] }
        assistanceReceived: { type: ["string", "null"] }
        dateOfAssistance: { type: string }
        verificationStatus: { type: string }

    BeneficiaryInput:
      type: object
      required: [name, gender, ageGroup, category, stateId]
      properties:
        name: { type: string, minLength: 1 }
        gender: { type: string }
        ageGroup: { type: string }
        category: { type: string }
        vulnerability: { type: string }
        stateId: { type: integer }
        localityId: { type: integer }
        projectId: { type: integer }
        assistanceReceived: { type: string }

    Risk:
      type: object
      required: [id, title, category, severity, likelihood, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        category: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: "Canonical 3-level scale (low/medium/high) plus legacy alias critical = high."
        likelihood:
          type: string
          enum: [low, medium, high, unlikely, possible, likely, almost_certain]
          description: "Canonical 3-level scale: low, medium, high. Legacy aliases unlikely/possible/likely/almost_certain are also accepted."
        impact:
          type: ["string", "null"]
          enum: [low, medium, high, critical, null]
          description: "Canonical 3-level impact scale: low, medium, high, critical."
        riskLevel: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, under_mitigation, closed, identified, assigned, mitigation_plan, follow_up, escalation, mitigated]
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        locationType:
          type: string
          nullable: true
          enum:
            - state
            - hq
          description: >
            Location type for this risk. "state" for state-linked risks,
            "hq" for HQ-scoped risks, null for legacy records.
        projectId: { type: ["integer", "null"] }
        projectTitle: { type: ["string", "null"] }
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        mitigationPlan: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        followUpDate: { type: ["string", "null"] }
        identifiedAt: { type: string }
        updatedAt: { type: string }

    RiskListResponse:
      type: object
      required: [items, total, page, limit, totalPages, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Risk" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
        summary:
          type: object
          description: "Scope-wide risk aggregates for the caller (independent of pagination)."
          required: [open, critical, high, medium, low]
          properties:
            open: { type: integer }
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }

    RiskInput:
      type: object
      required: [title, category, severity, likelihood]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        category:
          type: string
          description: "Common values: Operational, Security, Financial, Programmatic, Environmental. Free-text field — other values are accepted."
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: "Canonical 3-level scale: low, medium, high. critical is treated as high."
        likelihood:
          type: string
          enum: [low, medium, high, unlikely, possible, likely, almost_certain]
          description: "Canonical 3-level scale: low, medium, high. Legacy aliases unlikely/possible/likely/almost_certain are also accepted."
        impact:
          type: string
          enum: [low, medium, high, critical]
          description: "Canonical 3-level impact scale: low, medium, high, critical."
        stateId: { type: integer }
        locationType:
          type: string
          enum: [state, hq]
          description: >
            Required for HQ risk creation (stateId will be null).
            "state" for state-linked risks, "hq" for HQ-scoped risks.
        projectId: { type: integer }
        assignedToId: { type: integer }
        mitigationPlan: { type: string }
        dueDate: { type: string }

    RiskUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [open, under_mitigation, closed, identified, assigned, mitigation_plan, follow_up, escalation, mitigated]
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: "Canonical 3-level scale: low, medium, high. critical is treated as high."
        likelihood:
          type: string
          enum: [low, medium, high, unlikely, possible, likely, almost_certain]
          description: "Canonical 3-level scale: low, medium, high. Legacy aliases unlikely/possible/likely/almost_certain are also accepted."
        impact:
          type: string
          enum: [low, medium, high, critical]
          description: "Canonical 3-level impact scale: low, medium, high, critical."
        mitigationPlan: { type: string }
        assignedToId: { type: ["integer", "null"] }
        dueDate: { type: ["string", "null"] }

    Report:
      type: object
      required: [id, title, kind, status, period, submittedByName, submittedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        kind:
          type: string
          description: "Reporting frequency: monthly | quarterly | annual | on_demand. Historical records may contain other values."
        reportType:
          type: ["string", "null"]
          description: "Canonical report type: project | activity | program_state | hq_sector. NULL for unresolved legacy records."
          enum: [project, activity, program_state, hq_sector, null]
        activityId: { type: ["integer", "null"], description: "Activity linked to this report (Activity Reports only)." }
        reportingMonth: { type: ["integer", "null"] }
        reportingYear: { type: ["integer", "null"] }
        periodStart: { type: ["string", "null"] }
        periodEnd: { type: ["string", "null"] }
        sector: { type: ["string", "null"] }
        effectiveSector: { type: ["string", "null"], description: "COALESCE(r.sector, p.sector) — authoritative sector for display and filtering." }
        submittedTo: { type: ["string", "null"] }
        status:
          type: string
          description: "draft | submitted | state_reviewed | technically_approved | coordination_approved | approved | rejected | archived"
        projectId: { type: ["integer", "null"] }
        projectTitle: { type: ["string", "null"] }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        locationType:
          type: string
          nullable: true
          enum:
            - state
            - hq
          description: >
            Reporting location type. "state" for state-linked reports,
            "hq" for HQ-scoped reports, null for legacy records.
        period: { type: string }
        narrative: { type: ["string", "null"] }
        executiveSummary: { type: ["string", "null"] }
        challenges: { type: ["string", "null"] }
        recommendations: { type: ["string", "null"] }
        sections:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        beneficiariesMale: { type: ["integer", "null"] }
        beneficiariesFemale: { type: ["integer", "null"] }
        beneficiariesBoys: { type: ["integer", "null"] }
        beneficiariesGirls: { type: ["integer", "null"] }
        plannedBudget: { type: ["number", "null"] }
        actualExpenditure: { type: ["number", "null"] }
        activities:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        quarter: { type: ["integer", "null"], description: "Quarter number (1-4) for quarterly reports." }
        onDemandReason: { type: ["string", "null"], description: "Reason text for on-demand reports." }
        workflowPath: { type: ["string", "null"], description: "Immutable authoring path: state_authored (SPO-created) | technical_authored (TC-created) | null (simple chain)." }
        authorId: { type: ["integer", "null"], description: "Immutable original author user ID." }
        authorName: { type: ["string", "null"], description: "Immutable original author display name. 'Former User' when the account has been deleted." }
        migrationReviewNotes: { type: ["string", "null"], description: "Set for records migrated from legacy report_type values. Non-null indicates the record was reclassified." }
        submittedByName: { type: string }
        submittedAt: { type: string }
        approvalHistory:
          type: array
          items: { $ref: "#/components/schemas/ApprovalEntry" }

    ReportInput:
      type: object
      required: [title, kind, reportType, period]
      properties:
        title: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [monthly, quarterly, annual, on_demand]
          description: "Reporting frequency — must be one of the four canonical values."
        reportType:
          type: string
          enum: [project, activity, program_state, hq_sector]
          description: "Canonical report type — required. No default is applied."
        activityId:
          type: integer
          description: "Required for Activity Reports. Must belong to the specified project."
        reportingMonth: { type: integer, minimum: 1, maximum: 12 }
        reportingYear: { type: integer, minimum: 2000, maximum: 2100 }
        periodStart: { type: string, description: "ISO date" }
        periodEnd: { type: string, description: "ISO date" }
        sector: { type: string }
        submittedTo: { type: string }
        # HQSR-004: For reportType = hq_sector, stateId and projectId must be null/absent.
        # The server enforces this and returns 422 hq_sector_location_invalid if violated.
        projectId: { type: ["integer", "null"], description: "Required for Project and Activity reports. Optional for State Programme reports. MUST be null/absent for HQ Sector reports (422 hq_sector_location_invalid otherwise)." }
        stateId: { type: ["integer", "null"], description: "Required for Project and State Programme reports. MUST be null/absent for HQ Sector reports (422 hq_sector_location_invalid otherwise)." }
        period: { type: string }
        narrative: { type: string }
        executiveSummary: { type: string }
        challenges: { type: string }
        recommendations: { type: string }
        sections:
          type: object
          additionalProperties: true
        beneficiariesMale: { type: ["integer", "null"], minimum: 0 }
        beneficiariesFemale: { type: ["integer", "null"], minimum: 0 }
        beneficiariesBoys: { type: ["integer", "null"], minimum: 0 }
        beneficiariesGirls: { type: ["integer", "null"], minimum: 0 }
        plannedBudget: { type: number, minimum: 0 }
        actualExpenditure: { type: number, minimum: 0 }
        activities:
          type: array
          description: Manual activity entries written by the report author.
          items:
            type: object
            additionalProperties: true
        quarter:
          type: integer
          minimum: 1
          maximum: 4
          description: "Quarter number (1–4) for quarterly reports"
        onDemandReason:
          type: string
          description: "Reason for on-demand report (Donor Request, Management Request, etc.)"
        indicatorProgress:
          type: array
          description: Structured indicator progress entries per project indicator.
          items:
            type: object
            additionalProperties: true

    ReportDuplicateCheck:
      type: object
      required: [matchType]
      properties:
        matchType:
          type: string
          enum: [exact, none]
        existingReport:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            period: { type: string }
            status: { type: string }

    ProjectIndicator:
      type: object
      required: [id, name, target, achieved]
      properties:
        id: { type: integer }
        name: { type: string }
        target: { type: number }
        achieved: { type: number }
        unit: { type: ["string", "null"] }

    ReportAggregates:
      type: object
      required: [projectId, projectTitle, beneficiaries, budget, activities, indicators, risks]
      properties:
        projectId: { type: integer }
        projectTitle: { type: string }
        beneficiaries:
          type: object
          required: [male, female, boys, girls, total]
          properties:
            male: { type: integer }
            female: { type: integer }
            boys: { type: integer }
            girls: { type: integer }
            total: { type: integer }
        budget:
          type: object
          required: [planned, actual, remaining, burnRatePct]
          properties:
            planned: { type: number }
            actual: { type: number }
            remaining: { type: number }
            burnRatePct: { type: integer }
        activities:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: integer }
              title: { type: string }
              status: { type: string }
              startDate: { type: ["string", "null"] }
              endDate: { type: ["string", "null"] }
        indicators:
          type: array
          items:
            type: object
            required: [id, name, target, achieved]
            properties:
              id: { type: integer }
              name: { type: string }
              target: { type: number }
              achieved: { type: number }
              unit: { type: ["string", "null"] }
        risks:
          type: array
          items:
            type: object
            required: [id, title, severity, status]
            properties:
              id: { type: integer }
              title: { type: string }
              severity: { type: string }
              status: { type: string }

    ReportAuthorOption:
      type: object
      description: "A unique author present in the user's authorised Report population."
      required: [id, name]
      properties:
        id: { type: integer, description: "author_id from reports table." }
        name: { type: string, description: "Display name; 'Former User' for deleted accounts." }

    ReportPage:
      type: object
      description: "Paginated list of reports."
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        total: { type: integer, description: "Total matching records across all pages." }
        page: { type: integer, description: "Current 1-based page number." }
        pageSize: { type: integer, description: "Records per page." }
        totalPages: { type: integer, description: "Total number of pages." }

    ReportStats:
      type: object
      description: "Per-type report counts. Keys are canonical report types (project | activity | program_state | hq_sector)."
      additionalProperties:
        type: object
        required: [total, draft, awaitingApproval, approved, awaitingApprovalOver14Days]
        properties:
          total: { type: integer }
          draft: { type: integer }
          awaitingApproval: { type: integer }
          approved: { type: integer }
          awaitingApprovalOver14Days: { type: integer, description: "Awaiting-approval reports open > 14 days within this type." }

    ReportsSummary:
      type: object
      required: [total, draft, returned, awaitingApproval, approved, awaitingApprovalOver14Days, unresolvedLegacyCount, byState, bySector, byType]
      properties:
        total: { type: integer, description: "Canonical, non-archived reports in scope (includes draft, awaiting, approved, rejected)." }
        draft: { type: integer, description: "Reports with status = draft." }
        returned: { type: integer, description: "Current draft reports whose latest approval action is request_revision." }
        awaitingApproval: { type: integer, description: "Reports in submitted | state_reviewed | technically_approved | coordination_approved." }
        approved: { type: integer, description: "Reports with status = approved." }
        awaitingApprovalOver14Days: { type: integer, description: "Awaiting-approval reports whose current review cycle has been open > 14 days." }
        unresolvedLegacyCount: { type: integer, description: "Historical reports with NULL report_type — surfaced to HQ roles only. 0 for state/sector-scoped users." }
        byState:
          type: array
          items:
            type: object
            required: [stateId, stateName, count]
            properties:
              stateId: { type: integer }
              stateName: { type: string }
              stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
              count: { type: integer }
        bySector:
          type: array
          items:
            type: object
            required: [sector, count]
            properties:
              sector: { type: string }
              count: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [reportType, count]
            properties:
              reportType: { type: string }
              count: { type: integer }

    DashboardSummary:
      type: object
      description: "Operational fields are returned to every authenticated caller within scope. Financial properties are omitted unless the caller has an approved Budget & Donors role."
      required: [activeProjects, totalProjects, statesCount, totalBeneficiaries, beneficiariesTarget, highRiskStates, pendingApprovalsCount, delayedActivities, byStatus, monthlyAchievement]
      properties:
        activeProjects: { type: integer }
        totalProjects: { type: integer }
        completedProjects: { type: integer }
        statesCount: { type: integer }
        totalBeneficiaries: { type: integer }
        beneficiariesTarget: { type: integer }
        totalBudget: { type: number }
        totalSpent: { type: number }
        budgetRemaining: { type: number }
        budgetAllocated: { type: number }
        budgetUtilization:
          type: ["number", "null"]
          description: "Raw utilisation rate (Spent ÷ Allocated × 100); null when Allocated Budget is zero or unavailable"
        burnRatePct:
          type: ["number", "null"]
          description: "Raw utilisation rate (same value as budgetUtilization); null when Allocated Budget is zero or unavailable"
        currency:
          type: ["string", "null"]
          description: "ISO 4217 code when all in-scope projects share one currency; null when mixed"
        currencyMixed:
          type: boolean
          description: "true when in-scope projects span more than one currency"
        budgetByCurrency:
          type: array
          description: "Per-currency totals; populated when currencyMixed is true so callers can render each currency separately without mixing"
          items:
            type: object
            required: [currency, totalBudget, totalSpent, budgetRemaining]
            properties:
              currency: { type: string }
              totalBudget: { type: number }
              totalSpent: { type: ["number", "null"] }
              budgetRemaining: { type: ["number", "null"] }
              utilisationRate:
                type: ["number", "null"]
                description: "Raw utilisation rate for this currency group; null when totalBudget is zero"
        highRiskStates: { type: integer }
        openRisks: { type: integer }
        criticalRisks: { type: integer }
        reportsSubmitted: { type: integer }
        reportsPending: { type: integer }
        activitiesPlanned: { type: integer }
        activitiesCompleted: { type: integer }
        pendingApprovalsCount: { type: integer }
        delayedActivities: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        monthlyAchievement:
          type: array
          description: "Verified monthly achievement series. Empty when the source system has no dated, validated time-series data; consumers must render an unavailable state, not zero."
          items:
            type: object
            required: [month, target, achieved]
            properties:
              month: { type: string }
              target: { type: integer }
              achieved: { type: integer }

    ComponentScores:
      type: object
      properties:
        activityCompletion:   { type: number, nullable: true }
        reportSubmission:     { type: number, nullable: true }
        indicatorAchievement: { type: number, nullable: true }
        budgetUtilization:    { type: number, nullable: true }
        riskManagement:       { type: number, nullable: true }
        dataCompleteness:     { type: number, nullable: true }

    PerformanceScore:
      type: object
      required: [tier, dataAvailable, components]
      properties:
        overallScore: { type: number, nullable: true }
        tier: { type: string }
        dataAvailable: { type: boolean }
        components: { $ref: "#/components/schemas/ComponentScores" }

    FollowUpReasonCode:
      type: string
      enum:
        - draft_project
        - draft_project_report
        - report_awaiting_approval
        - returned_report
        - active_critical_risk
        - overdue_risk_mitigation

    FollowUpReason:
      type: object
      required: [code, label, count]
      properties:
        code:
          $ref: "#/components/schemas/FollowUpReasonCode"
        label:
          type: string
          description: Human-readable display text. May change with copy edits — never use for logic.
        count:
          type: integer
          minimum: 1
          description: Factual count of matching source records. Boolean project conditions always return 1.

    FollowUpProject:
      type: object
      required: [projectId, projectCode, projectTitle, sector, followUpReasons]
      properties:
        projectId:       { type: integer }
        projectCode:     { type: string }
        projectTitle:    { type: string }
        sector:          { type: string }
        followUpReasons:
          type: array
          items: { $ref: "#/components/schemas/FollowUpReason" }

    ProjectPerformanceScore:
      type: object
      required: [projectId, projectCode, projectTitle, sector, stateNames, status, tier, components]
      properties:
        projectId:   { type: integer }
        projectCode: { type: string }
        projectTitle: { type: string }
        sector:      { type: string }
        stateNames:  { type: array, items: { type: string } }
        status:      { type: string }
        overallScore: { type: number, nullable: true }
        tier:        { type: string }
        components:  { $ref: "#/components/schemas/ComponentScores" }
        activityCount:        { type: integer }
        openRisks:            { type: integer }
        criticalRisks:        { type: integer }
        recentReportStatus:   { type: string, nullable: true }

    LateReport:
      type: object
      required: [id, title, reportType, status]
      properties:
        id:              { type: integer }
        title:           { type: string }
        reportType:      { type: string }
        status:          { type: string }
        submittedAt:     { type: string }
        daysWaiting:     { type: integer }
        projectId:       { type: integer, nullable: true }
        projectCode:     { type: string, nullable: true }
        projectTitle:    { type: string, nullable: true }
        stateName:       { type: string, nullable: true }
        stateNameAr:     { type: string, nullable: true }
        submittedByName: { type: string, nullable: true }

    PmrCompletenessLocation:
      type: object
      required: [locationType, stateId, locationName, reportId, reportStatus, submittedAt, isMissing]
      properties:
        locationType: { type: string, enum: [hq, state] }
        stateId: { type: integer, nullable: true }
        locationName: { type: string }
        reportId: { type: integer, nullable: true }
        reportStatus: { type: string, nullable: true }
        submittedAt: { type: string, nullable: true }
        isMissing: { type: boolean }

    PmrCompletenessProject:
      type: object
      required: [projectId, projectName, projectCode, frequency, reportingPeriod, expectedLocations, reportsSubmitted, reportsApproved, missingLocations, completenessPercent, locations]
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        frequency: { type: string }
        reportingPeriod:
          type: object
          required: [year]
          properties:
            year: { type: integer }
            month: { type: integer }
            quarter: { type: integer }
        expectedLocations: { type: integer }
        reportsSubmitted: { type: integer }
        reportsApproved: { type: integer }
        missingLocations: { type: integer }
        completenessPercent: { type: number, nullable: true }
        locations:
          type: array
          items: { $ref: "#/components/schemas/PmrCompletenessLocation" }

    ConsolidatedReportLocation:
      type: object
      required: [locationType, stateId, locationName, isMissing, report]
      properties:
        locationType: { type: string, enum: [hq, state] }
        stateId: { type: integer, nullable: true }
        locationName: { type: string }
        isMissing: { type: boolean }
        report:
          type: object
          nullable: true
          required: [reportId, status, submittedAt, title]
          properties:
            reportId: { type: integer }
            status: { type: string }
            submittedAt: { type: string, nullable: true }
            title: { type: string }
            narrative: { type: string, nullable: true }
            executiveSummary: { type: string, nullable: true }
            challenges: { type: string, nullable: true }
            recommendations: { type: string, nullable: true }
            beneficiariesMale: { type: integer, nullable: true }
            beneficiariesFemale: { type: integer, nullable: true }
            beneficiariesBoys: { type: integer, nullable: true }
            beneficiariesGirls: { type: integer, nullable: true }
            activities: { nullable: true }
            indicatorProgress: { nullable: true }
            plannedBudget: { type: number, nullable: true }
            actualExpenditure: { type: number, nullable: true }
            currency: { type: string, nullable: true }

    ConsolidatedProjectReport:
      type: object
      required: [project, period, completeness, locations]
      properties:
        project:
          type: object
          required: [id, code, title, sector]
          properties:
            id: { type: integer }
            code: { type: string }
            title: { type: string }
            sector: { type: string }
        period:
          type: object
          required: [kind, reportingYear, label]
          properties:
            kind: { type: string, enum: [monthly, quarterly, annual, on_demand] }
            reportingYear: { type: integer }
            reportingMonth: { type: integer }
            quarter: { type: integer }
            label: { type: string }
        completeness:
          type: object
          required: [expectedLocations, reportsSubmitted, reportsApproved, missingLocations, completenessPercent]
          properties:
            expectedLocations: { type: integer }
            reportsSubmitted: { type: integer }
            reportsApproved: { type: integer }
            missingLocations: { type: integer }
            completenessPercent: { type: number, nullable: true }
        locations:
          type: array
          items: { $ref: "#/components/schemas/ConsolidatedReportLocation" }

    PmrReportingCompleteness:
      type: object
      required: [summary, projects]
      properties:
        summary:
          type: object
          required: [projectsInScope, expectedLocations, reportsSubmitted, reportsApproved, missingLocations, completenessPercent]
          properties:
            projectsInScope: { type: integer }
            expectedLocations: { type: integer }
            reportsSubmitted: { type: integer }
            reportsApproved: { type: integer }
            missingLocations: { type: integer }
            completenessPercent: { type: number, nullable: true }
        projects:
          type: array
          items: { $ref: "#/components/schemas/PmrCompletenessProject" }

    StatePerformance:
      type: object
      required: [stateId, stateName, activeProjects, beneficiaries, progressPct, riskLevel]
      properties:
        stateId: { type: integer }
        stateName: { type: string }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        activeProjects: { type: integer }
        beneficiaries: { type: integer }
        budgetUtilizationPct: { type: integer, nullable: true }
        progressPct: { type: integer }
        riskLevel: { type: string }
        openRisks: { type: integer }
        criticalRisks: { type: integer }
        reportsSubmitted: { type: integer }
        reportsPending: { type: integer }
        activityCompletionPct: { type: integer }
        reportingCompliancePct: { type: integer }
        performanceScore: { type: number, nullable: true }
        performanceTier: { type: string }
        components: { $ref: "#/components/schemas/ComponentScores" }
        currentScore: { type: number, nullable: true }
        previousScore: { type: number, nullable: true }
        scoreDifference: { type: number, nullable: true }
        trendDirection: { type: string, nullable: true }

    DashboardNotificationsSummary:
      type: object
      required: [totalUnread, byModule, recent]
      properties:
        totalUnread: { type: integer }
        byModule:
          type: array
          items:
            type: object
            required: [module, unread, total]
            properties:
              module: { type: string }
              unread: { type: integer }
              total: { type: integer }
        recent:
          type: array
          items:
            type: object
            required: [id, title, module, isRead, createdAt]
            properties:
              id: { type: integer }
              title: { type: string }
              module: { type: string }
              kind: { type: string }
              entityId: { type: integer }
              entityType: { type: string }
              isRead: { type: boolean }
              createdAt: { type: string }

    SectorBudgetResponse:
      type: object
      required: [sectors, unresolvedSectorProjects, unresolvedBudgetByCurrency]
      properties:
        sectors:
          type: array
          items: { $ref: "#/components/schemas/SectorBudgetEntry" }
          description: "Budget aggregates for the 7 canonical Main Sectors only"
        unresolvedSectorProjects:
          type: integer
          description: "Number of projects whose Main Sector is unresolved. Always 0 for Technical Coordinators."
        unresolvedBudgetByCurrency:
          type: object
          additionalProperties: { type: number }
          description: "Budget totals for unresolved-sector projects, keyed by currency. Do not cross-sum currencies."

    SectorBudgetCurrencyEntry:
      type: object
      required: [currency, projectCount, overallocatedProjectCount, overallocatedAmount, overspentProjectCount, overspentAmount]
      properties:
        currency: { type: string }
        projectCount: { type: integer }
        budgetTotal: { type: ["number", "null"], description: "null when no project budget is recorded" }
        activityPlanned: { type: ["number", "null"], description: "null when no activity budget values are recorded" }
        activitySpent: { type: ["number", "null"], description: "null when no expenditure is recorded" }
        remaining: { type: ["number", "null"], description: "Total Budget − Spent; null if either operand is missing" }
        unallocated: { type: ["number", "null"], description: "Total Budget − Activity Planned; null if either missing; negative = over-planned" }
        utilisationPct: { type: ["number", "null"], description: "Spent / Total Budget × 100; null if denominator is 0 or values missing; >100 preserved factually" }
        overallocatedProjectCount: { type: integer, description: "Projects where activity planned > budget_total" }
        overallocatedAmount: { type: number, description: "Sum of excess planned amounts for overallocated projects" }
        overspentProjectCount: { type: integer, description: "Projects where activity spent > budget_total" }
        overspentAmount: { type: number, description: "Sum of excess spent amounts for overspent projects" }

    SectorBudgetEntry:
      type: object
      required: [sector, projectCount, currencyMixed, budgetByCurrency]
      properties:
        sector: { type: string }
        projectCount: { type: integer }
        totalActivityCount: { type: ["integer", "null"], description: "null when no activities exist for any project in this sector" }
        incompleteActivityCount: { type: ["integer", "null"], description: "null when no activities exist; 0 when all activities are complete" }
        currencyMixed: { type: boolean }
        budgetByCurrency:
          type: array
          items: { $ref: "#/components/schemas/SectorBudgetCurrencyEntry" }
          description: "Per-currency financial metrics; never cross-summed across currencies"

    SectorPerformance:
      type: object
      required: [sector, projects, beneficiaries, indicatorAchievementPct, budgetUtilizationPct, mixedCurrencies]
      properties:
        sector: { type: string }
        projects: { type: integer }
        beneficiaries: { type: integer }
        indicatorAchievementPct: { type: integer }
        budgetUtilizationPct: { type: ["integer", "null"], description: "Single-currency sectors only; null when the sector spans multiple currencies or the budget/spend data is unavailable" }
        mixedCurrencies: { type: boolean, description: "true when the sector's projects span more than one currency — per-currency figures must be used instead of a combined ratio" }

    BeneficiariesBreakdown:
      type: object
      required: [summary, byState, bySector, byProject]
      properties:
        summary:
          type: object
          required: [male, female, boys, girls, total]
          properties:
            male: { type: integer }
            female: { type: integer }
            boys: { type: integer }
            girls: { type: integer }
            total: { type: integer }
        byState:
          type: array
          items:
            type: object
            required: [stateId, stateName, male, female, boys, girls, total]
            properties:
              stateId: { type: integer }
              stateName: { type: string }
              male: { type: integer }
              female: { type: integer }
              boys: { type: integer }
              girls: { type: integer }
              total: { type: integer }
        bySector:
          type: array
          items:
            type: object
            required: [sector, male, female, boys, girls, total]
            properties:
              sector: { type: string }
              male: { type: integer }
              female: { type: integer }
              boys: { type: integer }
              girls: { type: integer }
              total: { type: integer }
        byProject:
          type: array
          items:
            type: object
            required: [projectId, projectCode, projectTitle, sector, stateNames, male, female, boys, girls, total]
            properties:
              projectId: { type: integer }
              projectCode: { type: string }
              projectTitle: { type: string }
              sector: { type: string }
              stateNames:
                type: array
                items: { type: string }
              male: { type: integer }
              female: { type: integer }
              boys: { type: integer }
              girls: { type: integer }
              total: { type: integer }

    PendingApprovals:
      type: object
      required: [projects, reports]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }
        reports:
          type: array
          items: { $ref: "#/components/schemas/Report" }

    ActivityEntry:
      type: object
      required: [id, kind, message, actorName, timestamp]
      properties:
        id: { type: integer }
        kind: { type: string }
        message: { type: string }
        actorName: { type: string }
        actorRole: { type: ["string", "null"] }
        stateName: { type: ["string", "null"] }
        projectTitle: { type: ["string", "null"] }
        timestamp: { type: string }

    ProjectBudgetPerformanceEntry:
      type: object
      required: [projectId, projectCode, projectTitle, projectStatus, donorDataStatus, stateIds, stateNames, sectorNames, budgetBasis, missingStateExpenditure, hasBudgetData, hasMissingCurrency, hasRecordedExpenditure]
      properties:
        projectId:             { type: integer }
        projectCode:           { type: string }
        projectTitle:          { type: string }
        projectStatus:         { type: string }
        donorId:               { type: ["integer", "null"] }
        donorName:             { type: ["string", "null"] }
        donorDataStatus:       { type: string, description: "linked | unlinked | name_mismatch | missing" }
        stateIds:
          type: array
          items: { type: integer }
        stateNames:
          type: array
          items: { type: string }
        stateNamesAr:
          type: array
          items: { type: string }
          description: "Arabic State labels aligned by index with stateNames."
        sectorNames:
          type: array
          items: { type: string }
        sector:                { type: ["string", "null"] }
        budgetBasis:           { type: string, description: "Project-Level Budget | State Allocation" }
        currency:              { type: ["string", "null"] }
        allocatedBudget:
          type: ["number", "null"]
          description: "State Allocation basis: psa.budget_allocation. Project-Level basis: p.budget_total."
        spent:
          type: ["number", "null"]
          description: "Project-Level basis: activities.budget_spent (same source as Budget Summary). State Allocation basis: null (no reliable state-level expenditure source)."
        remainingBalance:      { type: ["number", "null"] }
        utilisationRate:
          type: ["number", "null"]
          description: "spent / allocatedBudget * 100; null when allocatedBudget is zero or null, or when budgetBasis is State Allocation"
        missingStateExpenditure:
          type: boolean
          description: "true when budgetBasis is State Allocation and state-level expenditure is unavailable; spent/remainingBalance/utilisationRate are null"
        projectLevelSpent:
          type: ["number", "null"]
          description: "State Allocation rows only: project-wide activities.budget_spent, provided for display in expanded detail only. Must not be used to calculate state-level remaining balance or utilisation."
        hasBudgetData:         { type: boolean }
        hasMissingCurrency:    { type: boolean }
        hasRecordedExpenditure: { type: boolean }
        stateAllocationAmount: { type: ["number", "null"], description: "SPO only: budget_allocation from project_state_allocations for their assigned state" }
        lastFinancialUpdate:   { type: ["string", "null"] }

    DonorPortfolioEntry:
      type: object
      required: [donor, projects, budgetTotal, beneficiaries, currencyMixed, donorName, dataStatus, projectCount, allocatedBudget]
      properties:
        # ── Legacy backward-compatible fields ──────────────────────────────
        donor: { type: string }
        projects: { type: integer }
        budgetTotal: { type: number, description: "Raw sum — may span multiple currencies when currencyMixed is true; use allocatedBudget per currency for display" }
        budgetSpent: { type: ["number", "null"], description: "Sum of all known activity spend; null when no activity records exist for this donor's projects" }
        beneficiaries: { type: integer }
        currency:
          type: ["string", "null"]
          description: "ISO 4217 code when all this donor's projects share one currency; null when mixed"
        currencyMixed:
          type: boolean
          description: "true when this donor's projects span more than one currency"
        budgetByCurrency:
          type: array
          description: "Per-currency budget totals; populated when currencyMixed is true or always"
          items:
            $ref: "#/components/schemas/DonorPortfolioBudgetByCurrencyItem"
        # ── Canonical fields (new) ─────────────────────────────────────────
        donorId:
          type: ["integer", "null"]
          description: "FK to donors table; null for unlinked free-text donors"
        donorName:
          type: string
          description: "Canonical donor name (from donors table) or free-text donor value when unlinked"
        freeTextDonorName:
          type: ["string", "null"]
          description: "Raw free-text donor value from the project record; may differ from canonical donorName"
        dataStatus:
          type: string
          description: "linked | unlinked | name_mismatch | missing"
        dataIssues:
          type: array
          description: "List of data quality issues for this donor group"
          items: { type: string }
        projectCount: { type: integer, description: "Number of unique projects attributed to this donor" }
        projectList:
          type: array
          description: "Project details for this donor group"
          items:
            type: object
            required: [id, code, title]
            properties:
              id: { type: integer }
              code: { type: string }
              title: { type: string }
        allocatedBudget:
          type: number
          description: "Total allocated budget (may span currencies when currencyMixed is true)"

    DonorPortfolioBudgetByCurrencyItem:
      type: object
      required: [currency, budgetTotal]
      properties:
        currency: { type: string }
        budgetTotal: { type: number }
        budgetSpent: { type: ["number", "null"], description: "Activity spend for this currency; null when no activity records exist" }
        allocatedBudget: { type: number, description: "Alias for budgetTotal; preferred field name" }

    PlanObjective:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: ["string", "null"] }
        priority: { type: ["string", "null"], description: "low | medium | high | critical" }
        expectedOutcome: { type: ["string", "null"] }

    PlanActivityInput:
      type: object
      required: [title]
      properties:
        id: { type: ["integer", "null"], description: "Present for existing activities" }
        title: { type: string }
        description: { type: ["string", "null"] }
        objectiveIndex: { type: ["integer", "null"] }
        responsibleUserId: { type: ["integer", "null"], description: "Legacy FK — prefer responsibleName" }
        responsibleName: { type: ["string", "null"], description: "Free-text responsible person name" }
        localityName: { type: ["string", "null"], description: "Free-text locality, with smart matching against plan/project localities" }
        stateId: { type: ["integer", "null"], description: "State where the activity takes place" }
        stateName: { type: ["string", "null"], description: "Denormalised state name for display" }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display" }
        plannedDate: { type: ["string", "null"], format: date, description: "Single planned date for the activity" }
        targetBeneficiaries: { type: integer, default: 0, description: "Number of planned beneficiaries" }
        priority: { type: string, default: "medium", description: "high | medium | low" }
        expectedResult: { type: ["string", "null"], description: "Expected result / outcome of the activity" }
        startDate: { type: ["string", "null"], format: date }
        endDate: { type: ["string", "null"], format: date }
        status: { type: string, default: "planned" }
        progressPct: { type: integer, default: 0 }
        budgetPlanned: { type: number, default: 0 }
        budgetActual: { type: number, default: 0 }
        riskId: { type: ["integer", "null"] }
        mitigationAction: { type: ["string", "null"] }
        expectedOutput: { type: ["string", "null"] }
        performanceIndicator: { type: ["string", "null"] }

    PlanActivity:
      allOf:
        - $ref: "#/components/schemas/PlanActivityInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
            responsibleUserName: { type: ["string", "null"] }
            riskTitle: { type: ["string", "null"] }

    PlanSummary:
      type: object
      required: [id, code, title, planType, status, startDate, endDate, budgetPlanned, budgetActual, progressPct, activitiesCount]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        planType: { type: string }
        frequency: { type: ["string", "null"] }
        status: { type: string }
        projectId: { type: ["integer", "null"] }
        projectTitle: { type: ["string", "null"] }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        locationType:
          type: string
          nullable: true
          enum:
            - state
            - hq
          description: >
            Location type for this plan. "state" for state-linked plans,
            "hq" for HQ-scoped plans, null for legacy records.
        localityId: { type: ["integer", "null"] }
        localities:
          type: array
          items: { type: string }
        sector: { type: ["string", "null"], description: "Legacy single sector — use sectors array for new code" }
        sectors:
          type: array
          items: { type: string }
          description: "Multi-sector array (replaces sector)"
        responsibleName: { type: ["string", "null"] }
        responsibleUserId: { type: ["integer", "null"] }
        responsibleUserName: { type: ["string", "null"] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        budgetPlanned: { type: number }
        budgetActual: { type: number }
        fundingSource: { type: ["string", "null"] }
        currency: { type: string }
        # null when the plan has no eligible (non-cancelled) activities — genuine
        # "no denominator" is distinct from 0% progress.
        progressPct: { type: ["integer", "null"] }
        activitiesCount: { type: integer }

    PlanDetail:
      allOf:
        - $ref: "#/components/schemas/PlanSummary"
        - type: object
          properties:
            description: { type: ["string", "null"] }
            objectives:
              type: array
              items: { $ref: "#/components/schemas/PlanObjective" }
            activities:
              type: array
              items: { $ref: "#/components/schemas/PlanActivity" }
            linkedRisks:
              type: array
              items: { $ref: "#/components/schemas/Risk" }
            createdById: { type: ["integer", "null"] }
            createdByName: { type: ["string", "null"] }
            createdAt: { type: ["string", "null"], format: date-time }
            updatedAt: { type: ["string", "null"], format: date-time }

    PlanInput:
      type: object
      required: [title, planType, startDate, endDate, sectors, responsibleName]
      properties:
        title: { type: string }
        planType: { type: string, description: "monthly | quarterly | annual | action | operational | emergency | custom" }
        frequency: { type: ["string", "null"], description: "weekly | monthly | quarterly | annual | on_demand" }
        projectId: { type: ["integer", "null"] }
        stateId: { type: integer }
        locationType:
          type: string
          enum: [state, hq]
          description: >
            Required for HQ plan creation (stateId will be null).
            "state" for state-linked plans, "hq" for HQ-scoped plans.
        localities:
          type: array
          items: { type: string }
          description: "Free-text locality names entered by user"
        localityId: { type: ["integer", "null"] }
        sector: { type: ["string", "null"], description: "Legacy single sector — derived from sectors[0]" }
        sectors:
          type: array
          items: { type: string }
          description: "One or more sectors (required, at least one)"
        responsibleName: { type: string, description: "Free-text responsible person name (required)" }
        responsibleUserId: { type: ["integer", "null"], description: "Legacy FK — prefer responsibleName" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, default: "draft" }
        description: { type: ["string", "null"] }
        budgetPlanned: { type: number, default: 0 }
        budgetActual: { type: number, default: 0 }
        fundingSource: { type: ["string", "null"] }
        currency: { type: string, default: "USD" }
        objectives:
          type: array
          items: { $ref: "#/components/schemas/PlanObjective" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/PlanActivityInput" }

    PlanningDashboard:
      type: object
      required: [totals, byState, bySector, byType, upcomingDeadlines, delayedActivities]
      properties:
        totals:
          type: object
          required: [total, active, delayed, completed, draft, budgetPlanned, budgetActual, burnRatePct, riskCount, activitiesTotal, activitiesCompleted]
          properties:
            total: { type: integer }
            active: { type: integer }
            delayed: { type: integer }
            completed: { type: integer }
            draft: { type: integer }
            budgetPlanned: { type: number }
            budgetActual: { type: number }
            burnRatePct: { type: integer }
            riskCount: { type: integer }
            activitiesTotal: { type: integer }
            activitiesCompleted: { type: integer }
        byState:
          type: array
          items:
            type: object
            required: [stateId, stateName, count]
            properties:
              stateId: { type: integer }
              stateName: { type: string }
              stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
              count: { type: integer }
        bySector:
          type: array
          items:
            type: object
            required: [sector, count]
            properties:
              sector: { type: string }
              count: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [planType, count]
            properties:
              planType: { type: string }
              count: { type: integer }
        upcomingDeadlines:
          type: array
          items:
            type: object
            required: [planId, title, endDate, status]
            properties:
              planId: { type: integer }
              title: { type: string }
              endDate: { type: string, format: date }
              status: { type: string }
              daysRemaining: { type: integer }
        delayedActivities:
          type: array
          items:
            type: object
            required: [activityId, planId, planTitle, title, endDate]
            properties:
              activityId: { type: integer }
              planId: { type: integer }
              planTitle: { type: string }
              title: { type: string }
              endDate: { type: ["string", "null"], format: date }
              status: { type: string }
              stateName: { type: ["string", "null"] }
              stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }

    AgendaItem:
      type: object
      required: [id, type, title, date, status, link]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        status: { type: string }
        link: { type: string }
        sector: { type: ["string", "null"] }

    DashboardAgenda:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }

    AuditEntry:
      type: object
      required: [id, action, module, timestamp, actionCategory, changeSummary, changes, usedOverride]
      properties:
        id: { type: integer }
        userName: { type: ["string", "null"] }
        userEmail: { type: ["string", "null"] }
        userRole: { type: ["string", "null"] }
        action: { type: string }
        module: { type: string }
        entityId: { type: ["integer", "null"] }
        entityReference: { type: ["string", "null"] }
        timestamp: { type: string }
        actionCategory: { type: ["string", "null"], enum: [created, updated, deleted, approved, null] }
        changeSummary: { type: string }
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditChange" }
        usedOverride: { type: boolean }
        overrideReason: { type: ["string", "null"] }
    AuditChange:
      type: object
      required: [field, before, after]
      properties:
        field: { type: string }
        before: { type: ["string", "null"] }
        after: { type: ["string", "null"] }
    AuditSummary:
      type: object
      required: [created, updated, deleted, approved]
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        approved: { type: integer }
    AuditLogPage:
      type: object
      required: [items, total, page, pageSize, totalPages, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        summary: { $ref: "#/components/schemas/AuditSummary" }

    ConversationSummary:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, description: "direct | group | project | state | sector | announcement" }
        name: { type: ["string", "null"] }
        projectId: { type: ["integer", "null"] }
        stateId: { type: ["integer", "null"] }
        sector: { type: ["string", "null"] }
        lastMessageBody: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"] }
        lastMessageSenderName: { type: ["string", "null"] }
        unreadCount: { type: ["integer", "null"], description: "Membership-scoped only; null for authorised operational non-members." }
        memberCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        otherMemberName: { type: ["string", "null"] }
        otherMemberRoleLabel: { type: ["string", "null"] }
        otherMemberStateName: { type: ["string", "null"] }
        otherMemberId: { type: ["integer", "null"] }

    ConversationListPage:
      type: object
      required: [items, hasMore, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationSummary" }
        hasMore: { type: boolean }
        nextCursor: { type: ["string", "null"] }

    ConversationMember:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        roleLabel: { type: ["string", "null"] }
        lastSeenAt: { type: ["string", "null"] }
        isOnline: { type: boolean, description: "Canonical authenticated Socket.IO presence at response time." }
        isAdmin: { type: boolean }

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            createdById: { type: integer }
            members:
              type: array
              items: { $ref: "#/components/schemas/ConversationMember" }

    MessageAttachment:
      type: object
      description: "Attachment metadata as returned in Message responses. objectPath and uploadToken are never present in responses."
      required: [type, name, url]
      properties:
        type: { type: string, description: "image | file | voice" }
        name: { type: string }
        url: { type: string, description: "Authorised message-bound proxy URL — clients must use this, never construct storage paths." }
        contentType: { type: ["string", "null"] }
        size: { type: ["integer", "null"] }
        duration: { type: ["number", "null"] }
        availabilityStatus:
          $ref: "#/components/schemas/AttachmentAvailabilityStatus"

    Reaction:
      type: object
      required: [emoji, userId, userName]
      properties:
        emoji: { type: string }
        userId: { type: integer }
        userName: { type: string }

    Message:
      type: object
      required: [id, conversationId, senderId, senderName, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: integer }
        senderName: { type: string }
        senderRoleLabel: { type: ["string", "null"] }
        body: { type: ["string", "null"], description: "Null when deleted_at is set (for_everyone deletion)." }
        attachments:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/MessageAttachment" }
          description: "Null when deleted_at is set. Proxy URLs only — no objectPath."
        replyToId: { type: ["integer", "null"] }
        replyBody: { type: ["string", "null"] }
        replySenderName: { type: ["string", "null"] }
        forwardedFromId: { type: ["integer", "null"] }
        editedAt: { type: ["string", "null"] }
        deletedAt: { type: ["string", "null"] }
        deletionType: { type: ["string", "null"], description: "for_everyone when shared tombstone; null otherwise." }
        isPinned: { type: boolean }
        pinnedBy: { type: ["integer", "null"] }
        pinnedAt: { type: ["string", "null"] }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }
        createdAt: { type: string }

    MessageHistoryPage:
      type: object
      required: [items, hasMore]
      description: "Bounded message history page. Items are in chronological order (oldest first). Use nextCursor to fetch the next older page."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        hasMore: { type: boolean }
        nextCursor:
          type: ["string", "null"]
          description: "Opaque cursor for the next (older) page. Do not construct or parse this value."

    ConversationMediaItem:
      type: object
      properties:
        type: { type: string }
        name: { type: string }
        url: { type: string }
        contentType: { type: ["string", "null"] }
        size: { type: ["integer", "null"] }
        duration: { type: ["number", "null"] }
        sentAt: { type: string }
        senderName: { type: string }
        messageId: { type: integer }

    ConversationMedia:
      type: object
      required: [photos, docs, voices]
      properties:
        photos: { type: array, items: { $ref: "#/components/schemas/ConversationMediaItem" } }
        docs: { type: array, items: { $ref: "#/components/schemas/ConversationMediaItem" } }
        voices: { type: array, items: { $ref: "#/components/schemas/ConversationMediaItem" } }

    ConversationInput:
      type: object
      required: [type]
      description: "Discriminated create body. Supply type-specific identity fields alongside the common fields."
      properties:
        type:
          type: string
          enum: [direct, group, project, state, sector, announcement]
        name: { type: string, description: "Required for announcement and group; optional for others." }
        memberIds:
          type: array
          items: { type: integer }
          description: "direct: must supply exactly one other member. group: one or more. project/state/sector: additional members merged with auto-enrolled users."
        projectId: { type: integer, description: "Required when type=project." }
        stateId: { type: integer, description: "Required when type=state." }
        sector: { type: string, description: "Required when type=sector. Must be a canonical CAFA sector." }
        targetAll: { type: boolean, description: "Announcement: target all active users." }
        targetStateId: { type: integer, description: "Announcement: target users in this state." }
        targetSector: { type: string, description: "Announcement: target users in this sector." }
        targetRole: { type: string, description: "Announcement: target users with this role." }

    MessageInput:
      type: object
      description: "Send a new message. Provide body, attachments, or both."
      properties:
        body: { type: string, maxLength: 10000 }
        replyToId:
          type: integer
          description: "Must reference a message in the same conversation that is not deleted and is visible to the sender."
        forwardedFromId:
          type: integer
          description: "Provenance reference to the message being forwarded. Source must be visible to the sender."
        mentionedUserIds:
          type: array
          items: { type: integer }
          description: "User IDs to mention. Each must be an active member of this conversation. Duplicate IDs are deduped. Canonical identity — do not resolve from display-name text."
        attachments:
          type: array
          items:
            type: object
            required: [name, type, contentType, size, objectPath, uploadToken]
            properties:
              type: { type: string, description: "image | file | voice" }
              name: { type: string }
              contentType: { type: string }
              size: { type: integer }
              duration: { type: number }
              objectPath: { type: string, description: "Private upload path from the upload descriptor. Consumed at message creation; never returned in Message responses." }
              uploadToken: { type: string, description: "Signed upload descriptor. Consumed and verified at message creation; never returned in Message responses." }

    MessageDeleteInput:
      type: object
      properties:
        deletionType:
          type: string
          enum: [for_me, for_everyone]
          description: "for_me = per-user private hide; for_everyone = shared tombstone. Defaults to for_me."

    ReactionInput:
      type: object
      required: [emoji]
      properties:
        emoji:
          type: string
          enum: ["👍", "❤️", "😂", "👏", "🎉", "🙏"]

    ConversationMemberInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }

    MessageEditInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 10000 }
