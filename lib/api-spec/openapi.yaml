        "201":
          description: Upload verified and attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalAttachment" }
        "400": { description: "Invalid or expired upload descriptor" }
        "403": { description: "Parent scope or mutation permission denied" }
        "404": { description: "Operation or parent not found" }
        "409": { description: "Parent lock, replacement conflict, or failed operation" }
        "422": { description: "Uploaded object is missing or metadata does not exactly match" }

