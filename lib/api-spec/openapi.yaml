        - { name: dateTo, in: query, required: false, description: "Valid ISO calendar date (YYYY-MM-DD), on or after dateFrom.", schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100000, multipleOf: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, multipleOf: 1, default: 25 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "400":
          description: Invalid audit filters
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [invalid_audit_filters] }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    User:
      type: object
      required: [id, name, role, scope]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, description: "super_admin | executive_director | program_manager | senior_program_coordinator | technical_coordinator | state_office_manager | state_program_officer | viewer" }
        roleLabel: { type: string }
        scope: { type: string, description: "hq | state" }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        sector: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }

    SwitcherUser:
      type: object
      required: [id, name, role, roleLabel, scope]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        roleLabel: { type: string }
        scope: { type: string }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        sector: { type: ["string", "null"] }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            username: { type: ["string", "null"] }
            phone: { type: ["string", "null"] }
            status: { type: string, description: "active | invited | suspended | inactive | deactivated" }
            languagePreference: { type: string, description: "en | ar" }
            lastLoginAt: { type: ["string", "null"], format: date-time }
            isOnline: { type: boolean, description: "True only while this API process has an authenticated Socket.IO connection for the user." }
            lastSeenAt: { type: ["string", "null"], format: date-time, description: "Persisted timestamp of the last final realtime-presence transition to offline." }
            createdAt: { type: ["string", "null"], format: date-time }
            updatedAt: { type: ["string", "null"], format: date-time }
            hasInvite: { type: boolean, description: "True when an unaccepted invite token exists. The token value itself is only returned once at issuance." }
            emailVerified: { type: boolean, description: "True if the user's email address has been verified." }
            emailVerifiedAt: { type: ["string", "null"], format: date-time, description: "When the email was verified." }

    UserDirectoryPage:
      type: object
      required: [items, total, limit, offset, hasMore, nextOffset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDetail" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 100000 }
        hasMore: { type: boolean }
        nextOffset: { type: ["integer", "null"], minimum: 0 }

    InvitationRecord:
      type: object
      required: [id, name, email, role, roleLabel, status, inviteEmailStatus, invitedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        roleLabel: { type: string }
        status: { type: string }
        inviteEmailStatus: { type: string, enum: [pending, sent, failed] }
        inviteExpiresAt: { type: ["string", "null"], format: date-time }
        inviteAcceptedAt: { type: ["string", "null"], format: date-time }
        invitedAt: { type: string, format: date-time }
        stateName: { type: ["string", "null"] }
        stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
        sector: { type: ["string", "null"] }
        invitedByName: { type: ["string", "null"] }

    InvitationListPage:
      type: object
      required: [invitations, total, summary, limit, offset, hasMore, nextOffset]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/InvitationRecord" }
        total: { type: integer, minimum: 0 }
        summary:
          $ref: "#/components/schemas/InvitationLifecycleSummary"
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 100000 }
        hasMore: { type: boolean }
        nextOffset: { type: ["integer", "null"], minimum: 0 }

    InvitationLifecycleSummary:
      type: object
      description: Lifecycle totals over the complete authorised result set after all active filters and before pagination.
      required: [total, pending, accepted, expired, cancelled]
      properties:
        total: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserDetail"
        - type: object
          properties:
            jobTitle: { type: ["string", "null"] }
            timezone: { type: string }
            access:
              type: object
              description: Canonical, read-only access assignment summary. Assignment changes are managed by authorised administrators.
              required: [kind, stateNames, sectors]
              properties:
                kind: { type: string, enum: [organisation_wide, state_scoped, sector_scoped, not_assigned] }
                stateNames: { type: array, items: { type: string } }
                sectors: { type: array, items: { type: string } }
            notificationPreferences: { $ref: "#/components/schemas/NotificationPreferences" }

    UpdateProfileInput:
      description: Only personal contact details and display preferences can be updated here. Identity, access, lifecycle, email, username, and photo paths are server-managed.
      additionalProperties: false
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: ["string", "null"], description: "International number, normalised to E.164." }
        jobTitle: { type: ["string", "null"], maxLength: 120 }
        languagePreference: { type: string, enum: [en, ar] }
        timezone: { type: string }
        notificationPreferences:
          oneOf:
            - $ref: "#/components/schemas/NotificationPreferences"
            - type: "null"

    ProfilePhotoUploadRequest:
      type: object
      required: [size, contentType]
      additionalProperties: false
      properties:
        size: { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }

    ProfilePhotoUploadDescriptor:
      type: object
      required: [uploadURL, uploadToken]
      properties:
        uploadURL: { type: string, format: uri, description: "Short-lived direct upload URL. Never store or display it." }
        uploadToken: { type: string, description: "Short-lived descriptor bound to the signed-in user. Submit only to complete the photo upload." }

    ProfilePhotoCompleteInput:
      type: object
      required: [uploadToken]
      additionalProperties: false
      properties:
        uploadToken: { type: string }

    ProfilePhotoResponse:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl: { type: ["string", "null"], description: "Authenticated self-profile photo proxy URL; never a storage object path." }

    NotificationPreferences:
      type: object
      description: >
        Validated notification preferences. Nested objects are partial so clients
        may update a subset; unknown keys are rejected. Daily and weekly digest
        modes are intentionally unavailable until a scheduler exists.
      additionalProperties: false
      properties:
        inApp:
          type: object
          additionalProperties: false
          properties:
            approvals: { type: boolean }
            approvalDecisions: { type: boolean }
            comments: { type: boolean }
            assignments: { type: boolean }
            mentions: { type: boolean }
            dueDates: { type: boolean }
            overdueItems: { type: boolean }
            highRisks: { type: boolean }
            criticalRisks: { type: boolean }
            systemNotifications: { type: boolean }
        email:
          type: object
          additionalProperties: false
          properties:
            approvalRequests: { type: boolean }
            approvalDecisions: { type: boolean }
            assignments: { type: boolean }
            mentions: { type: boolean }
            passwordReset: { type: boolean }
            userInvitations: { type: boolean }
            dueDateReminders: { type: boolean }
            highRisks: { type: boolean }
            criticalRisks: { type: boolean }
        deliveryOption:
          type: string
          enum: [inapp_only, email_only, both]
        digest:
          type: string
          enum: [immediate]
        quietHours:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
            end: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
            timezone:
              type: string
              enum: [Africa/Khartoum, Africa/Juba, Africa/Cairo, Africa/Nairobi, Africa/Addis_Ababa, Africa/Lagos, Europe/London, Europe/Berlin, Asia/Dubai, America/New_York, America/Los_Angeles, UTC]

    Notification:
      type: object
      required: [id, kind, entityType, entityId, message, link, readAt, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["integer", "null"] }
        message: { type: string }
        link: { type: ["string", "null"], description: "Safe internal CAFA PMIS route, or null." }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    NotificationPagination:
      type: object
      required: [limit, offset, hasMore, nextOffset]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
        hasMore: { type: boolean }
        nextOffset: { type: ["integer", "null"], minimum: 0 }

    NotificationListPage:
      type: object
      required: [items, unread, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread: { type: integer, minimum: 0 }
        pagination: { $ref: "#/components/schemas/NotificationPagination" }

    NotificationMutationResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        username: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        stateId: { type: ["integer", "null"] }
        sector: { type: ["string", "null"] }
        password: { type: ["string", "null"], format: password, description: "Required when status is not 'invited'." }
        status: { type: string, default: "invited" }
        languagePreference: { type: string, default: "en" }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        username: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        stateId: { type: ["integer", "null"] }
        sector: { type: ["string", "null"] }
        status: { type: string }
        languagePreference: { type: string }

    UserCreateResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserDetail" }
        inviteToken:
          type: ["string", "null"]
          description: "Present when the user was created in 'invited' status — share this token with the user to complete account setup."
        emailDelivered: { type: boolean }
        emailDelivery: { type: string, enum: [pending, sent, failed] }

    UserStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, description: "active | invited | suspended | inactive | deactivated" }

    UserEffectiveAccess:
      type: object
      required: [userId, displayName, email, role, roleLabel, scope, accountStatus, runtimeActive, modules]
      properties:
        userId: { type: integer }
        displayName: { type: string }
        email: { type: string }
        role: { type: string }
        roleLabel: { type: string }
        scope: { $ref: "#/components/schemas/EffectiveAccessScope" }
        accountStatus: { type: string }
        runtimeActive: { type: boolean, description: "True when account is active and would receive runtime access." }
        modules:
          type: array
          items: { $ref: "#/components/schemas/EffectiveModuleAccess" }

    EffectiveAccessScope:
      type: object
      required: [orgWide, stateId, stateName, sectors, projectCount, projectAssignmentsExtendScope]
      properties:
        orgWide: { type: boolean }
        stateId: { type: ["integer", "null"] }
        stateName: { type: ["string", "null"] }
        sectors:
          description: "null = no sector restriction; [] = TC with no sectors (fail-closed); [string, ...] = assigned sectors"
          type: ["array", "null"]
          items: { type: string }
        projectCount: { type: integer, minimum: 0 }
        projectAssignmentsExtendScope:
          type: boolean
          description: True when direct project assignments provide an additional record-level access path for a state-scoped user.

    EffectiveModuleAccess:
      type: object
      required: [module, label, actions]
      properties:
        module: { type: string }
        label: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/EffectiveModuleAction" }

    EffectiveModuleAction:
      type: object
      required: [action, label, result, reasonCode, reason]
      properties:
        action: { type: string }
        label: { type: string }
        result: { type: string, enum: [allowed, denied, conditional] }
        reasonCode: { type: string, description: Stable localisation key for the action-specific access rationale }
        reason: { type: string }

    UserStatusResponse:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string }

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    InviteResendInput:
      type: object
      properties:
        expiresInDays: { type: integer, minimum: 1, maximum: 90, default: 7 }
        message: { type: string, maxLength: 500 }

    InviteActionResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponse"
        - type: object
          required: [inviteToken, expiresAt, emailDelivered, emailDelivery]
          properties:
            inviteToken: { type: string }
            expiresAt: { type: string, format: date-time }
            emailDelivered: { type: boolean }
            emailDelivery: { type: string, enum: [pending, sent, failed] }

    VerificationResendResponse:
      allOf:
        - $ref: "#/components/schemas/OkResponse"
        - type: object
          required: [delivered]
          properties:
            delivered: { type: boolean }

    PasswordResetInput:
      type: object
      properties:
        password: { type: string, format: password, description: "New password — required unless 'invite' is true." }
        invite: { type: boolean, default: false, description: "When true, clear the existing password and issue a fresh invite token." }

    PasswordResetResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        inviteToken: { type: ["string", "null"] }

    UsersSummary:
      type: object
      required: [total, byStatus, byRole, byState]
      properties:
        total: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            required: [status, n]
            properties:
              status: { type: string }
              n: { type: integer }
        byRole:
          type: array
          items:
            type: object
            required: [role, label, n]
            properties:
              role: { type: string }
              label: { type: string }
              n: { type: integer }
        byState:
          type: array
          items:
            type: object
            required: [stateId, stateName, n]
            properties:
              stateId: { type: integer }
              stateName: { type: string }
              stateNameAr: { type: ["string", "null"], description: "Canonical Arabic State label for locale-aware display." }
              n: { type: integer }

    CurrentUser:
      type: object
      required: [user, permissions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: array
          items: { type: string }

    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: "Username or email" }
        password: { type: string, format: password }
        remember: { type: boolean, default: false }

    StateRecord:
      type: object
      description: Canonical Sudan State master-data record. Geographic identity, operational eligibility, and office presence are separate facts; it has no delete lifecycle.
      required: [id, name, nameAr, code, operationalStatus, officeStatus, officeAddress, managerName, localitiesCount]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 120 }
        nameAr: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 24 }
        operationalStatus: { type: string, enum: [active, inactive] }
        officeStatus: { type: string, enum: [present, absent, unknown] }
        officeAddress: { type: ["string", "null"], maxLength: 500 }
        managerName: { type: ["string", "null"] }
        localitiesCount: { type: integer }

    StateInput:
      type: object
      required: [name, nameAr, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        nameAr: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 24 }
        officeAddress: { type: ["string", "null"], maxLength: 500 }

    StateLifecycleInput:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, enum: [true] }
        operationalStatus: { type: string, enum: [active, inactive] }
        officeStatus: { type: string, enum: [present, absent, unknown] }

    StateValidationError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [validation_failed, invalid_state_id] }
        fields:
          type: object
          additionalProperties: { type: string }

    StateConflictError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [state_identity_conflict] }

    StateNotFoundError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: ["state not found"] }

    StateSnapshot:
      type: object
      required:
        [activeProjects, activeSectors, beneficiariesReached, activitiesCompleted,
         delayedActivities, openRisks, pendingApprovals]
      properties:
        activeProjects: { type: integer }
        activeSectors: { type: integer }
        beneficiariesReached: { type: integer }
        activitiesCompleted: { type: integer }
        delayedActivities: { type: integer }
        openRisks: { type: integer }
        pendingApprovals: { type: integer }

    Locality:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    StateProfile:
      type: object
      required: [id, name, nameAr, code, operationalStatus, officeStatus, officeAddress, managerName, localitiesCount, localities, projects]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 120 }
        nameAr: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 24 }
        operationalStatus: { type: string, enum: [active, inactive] }
        officeStatus: { type: string, enum: [present, absent, unknown] }
        managerName: { type: ["string", "null"] }
        officeAddress: { type: ["string", "null"] }
        localitiesCount: { type: integer }
        localities:
          type: array
          items: { $ref: "#/components/schemas/Locality" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/StateReferenceProject" }

    StateReferenceProject:
      type: object
      required: [id, code, title, status]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        status: { type: string }
        sector: { type: ["string", "null"] }

    Donor:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        abbreviation: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        createdAt: { type: string }

    DonorInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        abbreviation: { type: string }
        country: { type: string }
        contactName: { type: string }
        contactEmail: { type: string }

    ProjectDonorCorrectionInput:
      type: object
      required: [donorId, reason]
      properties:
        donorId:
          type: ["integer", "null"]
          minimum: 1
          description: "Registered donor ID, or null to record the explicit Unknown missing-donor state"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: "Mandatory human-readable administrative correction reason"

    ProjectDonorCorrection:
      type: object
      required: [projectId, projectCode, status, donor, donorId]
      properties:
        projectId: { type: integer }
        projectCode: { type: string }
        status: { type: string }
        donor: { type: string }
        donorId: { type: ["integer", "null"] }

    FocusedProjectDonorFinding:
      type: object
      required: [id, code, title, status, donor, donorId, classification, provenance]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        status: { type: string }
        donor: { type: string }
        donorId: { type: ["integer", "null"] }
        budgetTotal: { type: ["number", "string", "null"] }
        currency: { type: ["string", "null"] }
        classification:
          type: string
          enum: [confirmed_placeholder, explicit_missing_donor]
        provenance:
          type: string
          enum: [unlinked_free_text, explicit_missing_marker]

    FocusedProjectDonorScan:
      type: object
      required: [confirmedPlaceholders, explicitMissingDonors]
      properties:
        confirmedPlaceholders:
          type: array
          items: { $ref: "#/components/schemas/FocusedProjectDonorFinding" }
        explicitMissingDonors:
          type: array
          items: { $ref: "#/components/schemas/FocusedProjectDonorFinding" }

    ProjectSummary:
      type: object
      required: [id, code, title, status, sector, donor, startDate, endDate, progressPct, budgetTotal, budgetSpent, beneficiariesReached, beneficiariesTarget, stateIds, stateNames]
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        status: { type: string }
        sector: { type: string }
        sectors:
          type: array
          items: { type: string }
        classification: { type: ["string", "null"] }
        donor: { type: string }
        donorId: { type: ["integer", "null"] }
        startDate: { type: string }
        endDate: { type: string }
        progressPct: { type: integer }
        budgetTotal: { type: number }
        budgetSpent: { type: number }
        beneficiariesReached: { type: integer }
        beneficiariesTarget: { type: integer }
        stateIds:
          type: array
          items: { type: integer }
        stateNames:
          type: array
          items: { type: string }
        stateNamesAr:
          type: array
          items: { type: string }
          description: "Arabic labels aligned by index with stateNames."
        reportingFrequency:
          anyOf:
            - $ref: "#/components/schemas/ProjectReportingFrequency"
            - type: "null"
          description: "Scheduled PMR reporting cycle — null when not configured (historical projects)"
        reportingStartDate:
          type: ["string", "null"]
          format: date
          description: "First day covered by the project's reporting configuration; null when not configured"
        reportingEndDate:
          type: ["string", "null"]
          format: date
          description: "Last day covered by the project's reporting configuration; null when not configured"

    ProjectReportingFrequency:
      type: string
      enum: [monthly, quarterly, annual]
      description: >
        The project's normal scheduled PMR reporting cycle.
        On-Demand reports remain separately available regardless of this setting.
        Null indicates the scheduled frequency has not been configured (historical projects).

    ProjectAssignmentInput:
      type: object
      required: [role]
      properties:
        userId: { type: integer, description: "Omit or null for external/non-system persons" }
        name: { type: string, description: "Display name — required when userId is absent" }
        role: { type: string, description: "project_manager | technical_coordinator | finance_focal_point | meal_focal_point | state_focal_point" }

    ProjectAssignment:
