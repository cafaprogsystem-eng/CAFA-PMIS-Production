name = "cafa-pmis-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

# bcrypt.compare/.hash at cost factor 12 (login, invite-accept, password
# change/reset) is CPU-heavy by design — that's the whole point of bcrypt —
# and was intermittently (~50-60% of requests observed) exceeding this
# Cloudflare account's default Workers CPU limit, failing with a hard 503
# "Worker exceeded CPU time limit" (confirmed via `wrangler tail`, found
# live during pre-launch certification). A `[limits] cpu_ms` override was
# rejected outright while the account was on the Workers Free plan ("CPU
# limits are not supported for the Free plan"); the account has since been
# upgraded to Workers Paid, which is what makes this override effective.
[limits]
cpu_ms = 50000

# Same Neon database created in the Phase 1 connectivity proof
# (project cafa-pmis-cloudflare, aws-eu-central-1).
#
# Caching is explicitly DISABLED on this config (via `wrangler hyperdrive
# update <id> --caching-disabled`, not expressible in this file) — Hyperdrive
# caches SELECT responses for 60s by default and, per its own docs, "does
# not purge or invalidate cached read query responses when your application
# writes to your database." Confirmed live: a PATCH /notifications/:id/read
# was immediately followed by a GET /notifications still showing the row
# unread. Recreating this Hyperdrive config must pass --caching-disabled
# again, or every route in this app silently regains up to ~60s of
# read-your-own-writes staleness.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "feceb30510ff449897f114637dc5569e"

# Single global Durable Object holding every live realtime WebSocket
# connection via the Hibernation API — replaces Socket.IO's cluster-wide
# Postgres LISTEN/NOTIFY adapter entirely, since one DO instance is itself
# the single point of coordination. New DO classes on this account require
# the SQLite storage backend (no legacy KV backend available), which is also
# exactly what the presence grace-period alarm needs (ctx.storage.sql).
[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[vars]
# Placeholder for local/dev only — production and staging supply their own
# value via `wrangler secret put SESSION_SECRET` (never committed).
SESSION_SECRET = "dev-only-insecure-secret-change-me"
R2_BUCKET = "cafa-pmis-storage"
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT_URL are real
# credentials — set via `wrangler secret put`, never committed here.
PUBLIC_APP_URL = "https://staging.pmis.cafa.systems"
EMAIL_ENABLED = "false"
EMAIL_PROVIDER = "resend"
EMAIL_FROM_ADDRESS = "noreply@cafa.org"
EMAIL_FROM_NAME = "CAFA Program Management System"
AI_ENABLED = "false"
AI_DAILY_MESSAGE_LIMIT = "50"
AI_INTEGRATIONS_OPENAI_BASE_URL = "https://api.openai.com/v1"
# EMAIL_API_KEY / AI_INTEGRATIONS_OPENAI_API_KEY are real credentials — set
# via `wrangler secret put`, never committed here.

# ─────────────────────────────────────────────────────────────────────────
# Production environment for the cafa-pmis.org cutover — a genuinely
# separate Worker script (explicit `name` below), not a same-script
# redeploy of the config above. That config stays the ongoing test/dev
# environment; this one is the real launch target. Deploy with
# `wrangler deploy --env production`.
#
# Still TODO before this environment can deploy successfully:
#   1. DONE — Neon production database created (project cafa-pmis-production,
#      aws-eu-central-1), tracked migrations applied via scripts/migrate.mjs,
#      Hyperdrive config 844d6002fd5b463d82a6e00cc90a73e9 created against it
#      with --caching-disabled confirmed (origin.host =
#      ep-snowy-hat-b1rdcn9j-pooler.c-5.eu-central-1.aws.neon.tech).
#   2. DONE — SESSION_SECRET set (random 32-byte value, distinct from the
#      test environment's).
#   3. DONE — R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT_URL set,
#      a real R2 API token scoped to the cafa-pmis-production-storage
#      bucket.
#   4. `wrangler secret put EMAIL_API_KEY --env production` and
#      `AI_INTEGRATIONS_OPENAI_API_KEY --env production` once/if those are
#      turned on for production (EMAIL_ENABLED/AI_ENABLED default to
#      "false" below — flip explicitly, this is an operational decision
#      not made here).
#   5. DONE (declaratively) — see the [[env.production.routes]] block below
#      with custom_domain = true; wrangler attaches cafa-pmis.org on the
#      next `wrangler deploy --env production`, no manual dashboard step.
#   6. Build the real cafa-pmis frontend (`pnpm --filter cafa-pmis run
#      build` → dist/public) before that same deploy — blocked on this
#      dev machine by a pre-existing, unrelated native-binary gap
#      (@tailwindcss/oxide-darwin-arm64); needs CI or another machine.
# ─────────────────────────────────────────────────────────────────────────
[env.production]
name = "cafa-pmis-api-production"

# See the top-level [limits] comment above — not inherited from top-level
# (same non-inheritance behavior confirmed earlier for [vars]), so repeated
# here explicitly.
[env.production.limits]
cpu_ms = 50000

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "844d6002fd5b463d82a6e00cc90a73e9"

[[env.production.durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# Serves the built cafa-pmis SPA (artifacts/cafa-pmis/`pnpm run build` →
# dist/public) from this same Worker — single deployable unit, single
# domain, no CORS. run_worker_first ensures /api/* always reaches the Hono
# app above instead of ever being treated as a missing static asset; every
# other path falls through to the SPA (with client-side-routing fallback).
[env.production.assets]
directory = "../cafa-pmis/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Declarative Custom Domain — wrangler creates/attaches this automatically
# on `wrangler deploy --env production` (no separate manual dashboard step
# needed), provided the cafa-pmis.org zone is already active on this
# Cloudflare account (confirmed: Nameservers already point here). SSL is
# fully automatic (Cloudflare Universal SSL) — nothing else to configure.
[[env.production.routes]]
pattern = "cafa-pmis.org"
custom_domain = true

[env.production.vars]
# vars are NOT inherited from the top-level [vars] block by named
# environments (confirmed via `wrangler deploy --dry-run --env production`,
# which warns if this is missing) — every var, including this placeholder,
# must be repeated here even though it's identical to the top-level one.
SESSION_SECRET = "dev-only-insecure-secret-change-me"
# Left unset everywhere else (this repo's only other environment is the
# ongoing test/dev one) — gates isDemoRoleHarnessEnabled (lib/rbac.ts) and
# whether auth.ts's forgot-password/send-verification-email responses may
# ever expose a real token for non-production testing convenience. Setting
# this is a real security boundary, not a label — it must never be set
# anywhere real staff can actually reach.
NODE_ENV = "production"
R2_BUCKET = "cafa-pmis-production-storage"
PUBLIC_APP_URL = "https://cafa-pmis.org"
EMAIL_ENABLED = "false"
EMAIL_PROVIDER = "resend"
EMAIL_FROM_ADDRESS = "noreply@cafa.org"
EMAIL_FROM_NAME = "CAFA Program Management System"
AI_ENABLED = "false"
AI_DAILY_MESSAGE_LIMIT = "50"
AI_INTEGRATIONS_OPENAI_BASE_URL = "https://api.openai.com/v1"
