name = "cafa-pmis-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

# Same Neon database created in the Phase 1 connectivity proof
# (project cafa-pmis-cloudflare, aws-eu-central-1).
#
# Caching is explicitly DISABLED on this config (via `wrangler hyperdrive
# update <id> --caching-disabled`, not expressible in this file) — Hyperdrive
# caches SELECT responses for 60s by default and, per its own docs, "does
# not purge or invalidate cached read query responses when your application
# writes to your database." Confirmed live: a PATCH /notifications/:id/read
# was immediately followed by a GET /notifications still showing the row
# unread. Recreating this Hyperdrive config must pass --caching-disabled
# again, or every route in this app silently regains up to ~60s of
# read-your-own-writes staleness.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "feceb30510ff449897f114637dc5569e"

# Single global Durable Object holding every live realtime WebSocket
# connection via the Hibernation API — replaces Socket.IO's cluster-wide
# Postgres LISTEN/NOTIFY adapter entirely, since one DO instance is itself
# the single point of coordination. New DO classes on this account require
# the SQLite storage backend (no legacy KV backend available), which is also
# exactly what the presence grace-period alarm needs (ctx.storage.sql).
[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[vars]
# Placeholder for local/dev only — production and staging supply their own
# value via `wrangler secret put SESSION_SECRET` (never committed).
SESSION_SECRET = "dev-only-insecure-secret-change-me"
R2_BUCKET = "cafa-pmis-storage"
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT_URL are real
# credentials — set via `wrangler secret put`, never committed here.
PUBLIC_APP_URL = "https://staging.pmis.cafa.systems"
EMAIL_ENABLED = "false"
EMAIL_PROVIDER = "resend"
EMAIL_FROM_ADDRESS = "noreply@cafa.org"
EMAIL_FROM_NAME = "CAFA Program Management System"
AI_ENABLED = "false"
AI_DAILY_MESSAGE_LIMIT = "50"
AI_INTEGRATIONS_OPENAI_BASE_URL = "https://api.openai.com/v1"
# EMAIL_API_KEY / AI_INTEGRATIONS_OPENAI_API_KEY are real credentials — set
# via `wrangler secret put`, never committed here.
