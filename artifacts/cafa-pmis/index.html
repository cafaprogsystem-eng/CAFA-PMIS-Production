  <body>
    <!-- ── Language / direction bootstrap ──────────────────────────────
         Runs before React mounts to prevent a LTR→RTL direction flash.
         Reads the stored preference and applies lang/dir to <html>
         immediately. Defaults to English/LTR on any error.
    ─────────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem('cafa.lang');
          if (l !== 'en' && l !== 'ar') l = 'en';
          document.documentElement.lang = l;
          document.documentElement.dir  = l === 'ar' ? 'rtl' : 'ltr';
        } catch (_) {
          // localStorage unavailable — stay with HTML default (lang="en" dir="ltr")
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
