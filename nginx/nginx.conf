# ─── CAFA PMIS — Nginx reverse proxy ─────────────────────────────────────────
#
# Responsibilities:
#   • HTTP → HTTPS redirect (port 80 → 443)
#   • TLS termination using Let's Encrypt certificates
#   • Proxy all traffic to the Express API container
#   • Gzip compression for text assets
#   • Security headers
#
# Prerequisites:
#   1. Obtain a certificate first (HTTP must be reachable on port 80):
#        certbot certonly --webroot -w /var/www/certbot \
#          -d yourdomain.com --email you@example.com --agree-tos
#   2. Replace YOURDOMAIN below with your actual domain.
#   3. Mount this file into the nginx container:
#        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Upstream ──────────────────────────────────────────────────────────────
    # "api" matches the docker-compose service name.
    # If running without docker-compose, replace with the actual host:port.
    upstream cafa_api {
        server api:8080;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOURDOMAIN;

        # Allow Let's Encrypt ACME challenge through
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name YOURDOMAIN;

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN/privkey.pem;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;

        # HSTS (1 year) — enable only after confirming HTTPS works
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options   nosniff        always;
        add_header X-Frame-Options          SAMEORIGIN     always;
        add_header Referrer-Policy          no-referrer    always;

        # ── Proxy config ──────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 25M;

        # ── WebSocket support (Socket.IO) ─────────────────────────────────────
        location /api/socket.io/ {
            proxy_pass          http://cafa_api;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
        }

        # ── All other traffic → Express ────────────────────────────────────────
        # Express serves both the API (/api/*) and the compiled frontend (/).
        # The application Socket.IO endpoint is /api/socket.io/, not /socket.io/.
        location / {
            proxy_pass http://cafa_api;
        }
    }
}
